image: node:22

stages:
  - test
  - deploy

# Cache the pnpm store between jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store/

before_script:
  - corepack enable
  - pnpm config set store-dir .pnpm-store
  - pnpm install --frozen-lockfile

unit-tests:
  stage: test
  script:
    - mkdir -p reports
    - pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
  # Run this job on merge requests and the default branch
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'master'
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    paths:
      - reports/
    expire_in: 1 week

# GitLab Pages: static export served at https://davidawad.gitlab.io/thoth/
# Other branches deploy as parallel previews at
# https://davidawad.gitlab.io/thoth/<branch-slug>/ (path_prefix below), so the
# export's base path has to include that prefix too.
pages:
  stage: deploy
  needs: []
  cache: []
  variables:
    NEXT_PUBLIC_BASE_PATH: /thoth$PREVIEW_PATH
  script:
    - pnpm build
    # Pages serves whatever is in public/.
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  pages:
    path_prefix: $PREVIEW_PREFIX
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      variables:
        PREVIEW_PREFIX: $CI_COMMIT_REF_SLUG
        PREVIEW_PATH: /$CI_COMMIT_REF_SLUG
