* {

}
html,
body {
  margin: 0;
}
body {
  background: var(--bg);

}
button {

  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}
.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* chrome atoms */
.btn {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  letter-spacing: 0.02em;
  padding: 0.5rem 0.8rem;
  border: 1px solid var(--line2);
  background: var(--bg2);
  border-radius: 4px;
}

  background: var(--bg3);
}

  background: var(--accent);

}

  font-size: 0.68rem;

/* ===== the book ===== */
.fit {
  width: min(
    var(--maxw, 1020px),
    100%,
    calc((100svh - var(--chrome, 15rem)) * 1.42)
  );
  margin-inline: auto;
}
.fit.s1 {
  width: min(
    var(--maxw, 420px),
    100%,
    calc((100svh - var(--chrome, 12rem)) * 0.68)
  );
}
.book {
  position: relative;
  width: 100%;
  perspective: 2600px;
}
.spread {
  position: relative;
  width: 100%;
  container-type: inline-size;
  aspect-ratio: 1.42 / 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  transform-style: preserve-3d;
}
.spread.single {
  grid-template-columns: 1fr;
  aspect-ratio: 0.68 / 1;
}
.spread.single .pg.L {
  display: none;
}
.pg {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-chrome);
  font-size: 1.62cqw;
  line-height: 1.62;

}
.single .pg {
  font-size: 4.5cqw;
  padding: 9cqw 8cqw 8cqw;
}
.pg.L {
  background: linear-gradient(90deg, var(--paper) 78%, var(--paper2));
  border-radius: 4px 0 0 4px;
}
.pg.R {
  background: linear-gradient(270deg, var(--paper) 78%, var(--paper2));
  border-radius: 0 4px 4px 0;
}
.single .pg.R {
  background: var(--paper);
  border-radius: 4px;
}
.pg .rh {
  font-family: var(--font-mono);
  font-size: 0.6em;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-dim);
  display: flex;
  justify-content: space-between;
  margin-bottom: 1.4em;
}
.pg .txt {
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.pg .txt p {
  margin: 0;
  text-indent: 1.5em;
  hyphens: auto;
  text-align: left;
}
.pg .txt p.cont,
.pg .txt p.first {
  text-indent: 0;
}
.pg .folio {
  font-family: var(--font-mono);
  font-size: 0.62em;
  text-align: center;
  color: var(--ink-dim);
  padding-top: 0.8em;
}
.w {
  position: relative;
  border-radius: 2px;
}
.w .f {
  font-weight: inherit;
  color: var(--focus);
}
.w.cur {
  color: var(--ink);
  background: color-mix(in srgb, var(--focus) 16%, transparent);
  box-shadow: 0 0 0 0.12em color-mix(in srgb, var(--focus) 16%, transparent);
  font-weight: 600;
}
.pg.blank {
  background: var(--paper);
}

/* 3D leaf */
.flip {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 50%;
  transform-origin: 0 50%;
  transform-style: preserve-3d;
  z-index: 5;
  display: none;
  will-change: transform;
}
.single .flip {
  width: 100%;
}
.flip.on {
  display: block;
}
.flip .face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.flip .face.back {
  transform: rotateY(180deg);
}
.flip .face .shade {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(90deg, var(--shade), transparent 60%);
  opacity: 0;
}
.flip .face.back .shade {
  background: linear-gradient(270deg, var(--shade), transparent 60%);
}
.pg.L .gutter,
.pg.R .gutter {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6cqw;
  pointer-events: none;
}
.pg.L .gutter {
  right: 0;
  background: linear-gradient(270deg, rgba(0, 0, 0, 0.2), transparent);
}
.pg.R .gutter {
  left: 0;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.2), transparent);
}
.single .gutter {
  display: none;
}

/* playback head (single word, red focus letter on a fixed pivot) */
.head {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: baseline;
  font-family: var(--font-legible);
  font-size: 2rem;
  line-height: 1.1;
  white-space: nowrap;
}
.head .hl {
  text-align: right;
}
.head .hr {
  text-align: left;
}
.head .hf {
  color: var(--focus);
  font-weight: 700;
}
.head .hl,
.head .hr {
  overflow: hidden;
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}

:root[data-theme='light'] { --paper: #f6efdc; --paper2: #f6efdc; --ink: #1d150b; --ink-dim: #b3a688; --focus: #c0261b; --hl: transparent; --desk: #e2d6b6; }
:root[data-theme='sepia'] { --paper: #f2e6c6; --paper2: #f2e6c6; --ink: #33281a; --ink-dim: #b9a67c; --focus: #b3261e; --hl: transparent; --desk: #d8c797; }

body { background: var(--desk); padding-bottom: 5.2rem; }
.hair { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: var(--line); z-index: 9; } .hair i { display: block; height: 100%; width: calc(var(--p,0)*100%); background: var(--accent); }
.top { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.6rem; color: var(--muted); font-family: var(--font-mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; } .top .btn { background: none; }
.stage { padding: 0 1.4rem; display: grid; justify-items: center; } .fit { --chrome: 12rem; --maxw: 1100px; }
.pg, .pg.L, .pg.R { background: var(--paper); font-family: var(--font-chrome); font-size: 1.95cqw; line-height: 1.62; padding: 6cqw 6.4cqw 5cqw; }
.pg .txt p { text-indent: 0; margin-bottom: .75em; } .pg .gutter { display: none; } .pg.L { border-right: 1px solid var(--line); }
.pg .rh, .pg .folio { opacity: .8; }

.w { color: var(--ink-dim); transition: color .25s; } .w.in-s, .w.cur { color: var(--ink); } .w.read:not(.in-s) { color: color-mix(in srgb, var(--ink-dim) 70%, transparent); }
.w.cur { background: none; box-shadow: none; color: var(--ink); font-weight: 600; text-shadow: 0 0 .6em color-mix(in srgb, var(--focus) 45%, transparent); }
.w.in-s { color: var(--ink); }
.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1rem; padding: .7rem 1.6rem calc(.7rem + env(safe-area-inset-bottom, 0px)); background: var(--bg2); border-top: 1px solid var(--line2); }
.bottom .head { font-size: 1.9rem; min-width: 14rem; } .bottom .l, .bottom .r { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; } .bottom .r { justify-content: flex-end; }
@media (max-width: 760px) { .bottom { grid-template-columns: 1fr; padding: .6rem 1rem; } .bottom .l, .bottom .r { justify-content: center; } body { padding-bottom: 9rem; } .pg, .pg.R { font-size: 4.9cqw; } }

<script>window.BOOK_TEXT = {
  "title": "Meditations",
  "author": "Marcus Aurelius",
  "chapter": "The Second Book",
  "paras": [
    "I. Remember how long thou hast already put off these things, and how often a certain day and hour as it were, having been set unto thee by the gods, thou hast neglected it. It is high time for thee to understand the true nature both of the world, whereof thou art a part; and of that Lord and Governor of the world, from whom, as a channel from the spring, thou thyself didst flow: and that there is but a certain limit of time appointed unto thee, which if thou shalt not make use of to calm and allay the many distempers of thy soul, it will pass away and thou with it, and never after return.",
    "II. Let it be thy earnest and incessant care as a Roman and a man to perform whatsoever it is that thou art about, with true and unfeigned gravity, natural affection, freedom and justice: and as for all other cares, and imaginations, how thou mayest ease thy mind of them. Which thou shalt do; if thou shalt go about every action as thy last action, free from all vanity, all passionate and wilful aberration from reason, and from all hypocrisy, and self-love, and dislike of those things, which by the fates or appointment of God have happened unto thee. Thou seest that those things, which for a man to hold on in a prosperous course, and to live a divine life, are requisite and necessary, are not many, for the gods will require no more of any man, that shall but keep and observe these things.",
    "III. Do, soul, do; abuse and contemn thyself; yet a while and the time for thee to respect thyself, will be at an end. Every man's happiness depends from himself, but behold thy life is almost at an end, whiles affording thyself no respect, thou dost make thy happiness to consist in the souls, and conceits of other men.",
    "IV. Why should any of these things that happen externally, so much distract thee? Give thyself leisure to learn some good thing, and cease roving and wandering to and fro. Thou must also take heed of another kind of wandering, for they are idle in their actions, who toil and labour in this life, and have no certain scope to which to direct all their motions, and desires.",
    "V. For not observing the state of another man's soul, scarce was ever any man known to be unhappy. Tell whosoever they be that intend not, and guide not by reason and discretion the motions of their own souls, they must of necessity be unhappy.",
    "VI. These things thou must always have in mind: What is the nature of the universe, and what is mine—in particular: This unto that what relation it hath: what kind of part, of what kind of universe it is: And that there is nobody that can hinder thee, but that thou mayest always both do and speak those things which are agreeable to that nature, whereof thou art a part.",
    "VII. Theophrastus, where he compares sin with sin (as after a vulgar sense such things I grant may be compared:) says well and like a philosopher, that those sins are greater which are committed through lust, than those which are committed through anger. For he that is angry seems with a kind of grief and close contraction of himself, to turn away from reason; but he that sins through lust, being overcome by pleasure, doth in his very sin bewray a more impotent, and unmanlike disposition. Well then and like a philosopher doth he say, that he of the two is the more to be condemned, that sins with pleasure, than he that sins with grief. For indeed this latter may seem first to have been wronged, and so in some manner through grief thereof to have been forced to be angry, whereas he who through lust doth commit anything, did of himself merely resolve upon that action.",
    "VIII. Whatsoever thou dost affect, whatsoever thou dost project, so do, and so project all, as one who, for aught thou knowest, may at this very present depart out of this life. And as for death, if there be any gods, it is no grievous thing to leave the society of men. The gods will do thee no hurt, thou mayest be sure. But if it be so that there be no gods, or that they take no care of the world, why should I desire to live in a world void of gods, and of all divine providence? But gods there be certainly, and they take care for the world; and as for those things which be truly evil, as vice and wickedness, such things they have put in a man's own power, that he might avoid them if he would: and had there been anything besides that had been truly bad and evil, they would have had a care of that also, that a man might have avoided it. But why should that be thought to hurt and prejudice a man's life in this world, which cannot any ways make man himself the better, or the worse in his own person? Neither must we think that the nature of the universe did either through ignorance pass these things, or if not as ignorant of them, yet as unable either to prevent, or better to order and dispose them. It cannot be that she through want either of power or skill, should have committed such a thing, so as to suffer all things both good and bad, equally and promiscuously, to happen unto all both good and bad. As for life therefore, and death, honour and dishonour, labour and pleasure, riches and poverty, all these things happen unto men indeed, both good and bad, equally; but as things which of themselves are neither good nor bad; because of themselves, neither shameful nor praiseworthy.",

    "XI. Consider with thyself how man, and by what part of his, is joined unto God, and how that part of man is affected, when it is said to be diffused. There is nothing more wretched than that soul, which in a kind of circuit compasseth all things, searching (as he saith) even the very depths of the earth; and by all signs and conjectures prying into the very thoughts of other men's souls; and yet of this, is not sensible, that it is sufficient for a man to apply himself wholly, and to confine all his thoughts and cares to the tendance of that spirit which is within him, and truly and really to serve him. His service doth consist in this, that a man keep himself pure from all violent passion and evil affection, from all rashness and vanity, and from all manner of discontent, either in regard of the gods or men. For indeed whatsoever proceeds from the gods, deserves respect for their worth and excellency; and whatsoever proceeds from men, as they are our kinsmen, should by us be entertained, with love, always; sometimes, as proceeding from their ignorance, of that which is truly good and bad, (a blindness no less, than that by which we are not able to discern between white and black:) with a kind of pity and compassion also.",

      '</div>' +
      note +
      (C.pageExtra ? C.pageExtra(idx) : '') +
      '<i class="gutter"></i>'
    );
  }
  function wordInner(i) {
    var t = words[i].t;
    if (i !== ci) return esc(t);
    var f = focusIdx(t);
    return (
      esc(t.slice(0, f)) +
      '<b class="f">' +
      esc(t[f]) +
      '</b>' +
      esc(t.slice(f + 1))
    );
  }

  var book, spEl, L, R, F, Ff, Fb;
  function build() {
    book = $('.book');
    book.innerHTML =
      '<div class="spread"><section class="pg L"></section><section class="pg R"></section><div class="flip"><div class="face front"><section class="pg"></section><i class="shade"></i></div><div class="face back"><section class="pg"></section><i class="shade"></i></div></div></div>';
    spEl = $('.spread', book);
    L = $('.pg.L', spEl);
    R = $('.pg.R', spEl);
    F = $('.flip', spEl);
    Ff = $('.front .pg', F);
    Fb = $('.back .pg', F);
  }
  function fill(el, idx, side) {
    el.className =
      'pg ' + side + (idx < 0 || idx >= pages.length ? ' blank' : '');
    el.innerHTML = pageHTML(idx, side);
  }
  function show(k) {
    spread = Math.max(0, Math.min(spreadCount() - 1, k));
    var base = spread * perUnit();
    if (single) {
      fill(R, base, 'R');
      L.innerHTML = '';
    } else {
      fill(L, base, 'L');
      fill(R, base + 1, 'R');
    }
    mark();
    info();
  }
  function mark() {
    $$('.pg', spEl).forEach(function (pg) {
      pg.classList.remove('has-cur');
    });
    var el = $('.w.cur', spEl);
    if (!el) return;
    var pg = el.closest('.pg');
    pg.classList.add('has-cur');
    var pr = pg.getBoundingClientRect(),
      er = el.getBoundingClientRect(),
      k = pr.width / pg.offsetWidth || 1;
    pg.style.setProperty('--cy', (er.top - pr.top) / k + 'px');
    pg.style.setProperty('--cx', (er.left - pr.left) / k + 'px');
    pg.style.setProperty('--ch', er.height / k + 'px');
    pg.style.setProperty('--cw', er.width / k + 'px');
    var s = words[ci].s;
    $$('.w', spEl).forEach(function (w) {
      var i = +w.dataset.i;
      w.classList.toggle('in-s', +w.dataset.s === s);
      w.classList.toggle('read', i < ci);
    });
    spEl.style.setProperty(
      '--sy',
      er.top - spEl.getBoundingClientRect().top + 'px',
    );
  }
  function setCur(i) {
    var prev = $('.w.cur', spEl);
    if (prev) {
      prev.classList.remove('cur');
      prev.innerHTML = esc(words[+prev.dataset.i].t);
    }
    ci = i;
    var el = $('.w[data-i="' + i + '"]', spEl);
    if (el) {
      el.classList.add('cur');
      el.innerHTML = wordInner(i);
    }
    mark();
    head();
    info();
  }
  function head() {
    var t = words[ci].t,
      f = focusIdx(t);
    $$('[data-head]').forEach(function (h) {
      h.innerHTML =
        '<span class="hl">' +
        esc(t.slice(0, f)) +
        '</span><span class="hf">' +
        esc(t[f]) +
        '</span><span class="hr">' +
        esc(t.slice(f + 1)) +
        '</span>';
    });
  }
  function info() {
    var pg = pages.findIndex(function (r) {
        return ci >= r[0] && ci < r[1];
      }),
      pu = perUnit(),
      a = spread * pu + 1,
      b = Math.min(a + pu - 1, pages.length);
    var pct = Math.round((ci / (N - 1)) * 100);
    $$('[data-pageinfo]').forEach(function (e) {
      e.textContent =
        (pu === 1 || a === b ? 'Page ' + a : 'Pages ' + a + '–' + b) +
        ' of ' +
        pages.length;
    });
    $$('[data-pct]').forEach(function (e) {
      e.textContent = pct + '%';
    });
    $$('[data-left]').forEach(function (e) {
      e.textContent =
        '~' + Math.max(1, Math.round((N - ci) / (60000 / rate))) + ' min left';
    });
    $$('[data-progress]').forEach(function (e) {
      e.style.setProperty('--p', pct / 100);
    });
    $$('[data-wordpos]').forEach(function (e) {
      e.textContent = 'word ' + (ci + 1) + ' of ' + N;
    });
    $$('[data-chapinfo]').forEach(function (e) {
      e.textContent = T.chapter;
    });
    $$('[data-rate]').forEach(function (e) {
      e.textContent = Math.round((60000 / rate) * 1.0) + ' wpm';
    });
    $$('[data-scrub]').forEach(function (e) {
      e.max = N - 1;
      e.value = ci;
    });
    $$('[data-stack-l]').forEach(function (e) {
      e.style.setProperty(
        '--n',
        Math.min(1, (spread * pu) / Math.max(1, pages.length - 1)),
      );
    });
    $$('[data-stack-r]').forEach(function (e) {
      e.style.setProperty(
        '--n',
        1 - Math.min(1, ((spread + 1) * pu) / Math.max(1, pages.length)),
      );
    });
    $$('[data-prev]').forEach(function (e) {
      e.disabled = spread === 0;
    });
    $$('[data-next]').forEach(function (e) {
      e.disabled = spread >= spreadCount() - 1;
    });
  }

  /* page turn: a leaf (front/back faces) rotating about the gutter */
  function turn(dir, done) {
    var to = spread + dir;
    if (busy || to < 0 || to >= spreadCount()) {
      done && done(false);
      return;
    }
    var pu = perUnit(),
      a = spread * pu,
      na = to * pu;
    if (reduced) {
      show(to);
      firstWord();
      done && done(true);
      return;
    }
    busy = true;
    book.classList.add('turning');
    var anim;
    if (dir > 0) {
      if (single) {
        fill(R, na, 'R');
      } else {
        fill(R, na + 1, 'R');
      }
      fill(Ff, single ? a : a + 1, 'R');
      fill(Fb, single ? -1 : na, 'L');
      F.classList.add('on');
      anim = F.animate(
        [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }],
        {
          duration: 820,
          easing: 'cubic-bezier(.45,.05,.25,1)',
          fill: 'forwards',
        },
      );
    } else {
      if (single) {
        fill(R, a, 'R');
      } else {
        fill(L, na, 'L');
        fill(R, a + 1, 'R');
      }
      fill(Ff, single ? na : na + 1, 'R');
      fill(Fb, single ? -1 : a, 'L');
      F.classList.add('on');
      anim = F.animate(
        [{ transform: 'rotateY(-180deg)' }, { transform: 'rotateY(0deg)' }],
        {
          duration: 820,
          easing: 'cubic-bezier(.45,.05,.25,1)',
          fill: 'forwards',
        },
      );
    }
    var sh = $$('.shade', F),
      from = dir > 0 ? [0, 0.55, 0] : [0, 0.55, 0];
    sh.forEach(function (s) {
      s.animate(
        [{ opacity: 0 }, { opacity: 0.8, offset: 0.5 }, { opacity: 0 }],
        { duration: 820, easing: 'ease-in-out' },
      );
    });
    var fz = location.search.match(/flipat=([\d.]+)/);
    if (fz) {
      anim.pause();
      anim.currentTime = +fz[1] * 820;
      $$('.shade', F).forEach(function (x) {
        x.getAnimations().forEach(function (a) {
          a.pause();
          a.currentTime = +fz[1] * 820;
        });
      });
      return;
    }
    anim.onfinish = function () {
      anim.cancel();
      F.classList.remove('on');
      busy = false;
      book.classList.remove('turning');
      spread = to;
      show(to);
      if (!playing || !done) firstWord();
      done && done(true);
    };
  }
  function firstWord() {
    var r = pages[spread * perUnit()];
    if (
      r &&
      (ci < r[0] ||
        ci >=
          pages[
            Math.min(pages.length - 1, spread * perUnit() + perUnit() - 1)
          ][1])
    )
      setCur(r[0]);
    else mark();
    head();
    info();
  }

  /* playback */
  function tick() {
    if (!playing) return;
    var nx = ci + 1;
    if (nx >= N) {
      play(false);
      return;
    }
    if (spreadOfWord(nx) !== spread) {
      ci = nx;
      head();
      turn(1, function () {
        setCur(nx);
        timer = setTimeout(tick, rate);
      });
      return;
    }
    setCur(nx);
    var w = words[nx].t,
      d =
        rate *
        (w.length > 7 ? 1.25 : 1) *
        (/[,;]$/.test(w) ? 1.5 : 1) *
        (/[.!?]["”’)]?$/.test(w) ? 2.2 : 1);
    timer = setTimeout(tick, d);
  }
  function play(on) {
    playing = on === undefined ? !playing : on;
    document.body.classList.toggle('playing', playing);
    $$('[data-playlabel]').forEach(function (e) {
      e.textContent = playing ? 'Pause' : 'Play';
    });
    clearTimeout(timer);
    if (playing) {
      if (spreadOfWord(ci) !== spread) {
        show(spreadOfWord(ci));
      }
      timer = setTimeout(tick, 120);
    }
  }

  /* themes */
  var themes = ['dark', 'light', 'sepia'];
  function theme(t) {
    document.documentElement.setAttribute('data-theme', t);
    $$('[data-themename]').forEach(function (e) {
      e.textContent = t;
    });
    try {
      localStorage.setItem('bv-theme', t);
    } catch (e) {}
    setTimeout(mark, 30);
  }

  /* chapters (mock table of contents for the book) */
  var CH = [
    'Book I',
    'Book II',
    'Book III',
    'Book IV',
    'Book V',
    'Book VI',
    'Book VII',
    'Book VIII',
    'Book IX',
    'Book X',
    'Book XI',
    'Book XII',
  ];
  function chapters() {
    $$('[data-toc-list]').forEach(function (ul) {
      ul.innerHTML = CH.map(function (c, i) {
        return (
          '<li><button type="button" class="chbtn' +
          (i === 1 ? ' on' : '') +
          '"' +
          (i === 1 ? ' aria-current="true"' : '') +
          '><span class="chn">' +
          (i + 1) +
          '</span><span>' +
          c +
          '</span></button></li>'
        );
      }).join('');
    });
    $$('[data-rail]').forEach(function (r) {
      r.innerHTML = CH.map(function (c, i) {
        return (
          '<i class="tick' + (i === 1 ? ' on' : '') + '" title="' + c + '"></i>'
        );
      }).join('');
    });
  }

  function relayout() {
    var s = C.forceSingle || matchMedia('(max-width: 760px)').matches;
    var w = ci;
    if (s === single && pages.length) return;
    single = s;
    layout();
    spEl.classList.toggle('single', single);
    show(spreadOfWord(w));
    setCur(w);
  }

  function boot() {
    build();
    chapters();
    layout();
    var st = null;
    try {
      st = localStorage.getItem('bv-theme');
    } catch (e) {}
    var q = (location.search.match(/theme=(\w+)/) || [])[1];
    theme(q || st || 'dark');
    single = C.forceSingle || matchMedia('(max-width: 760px)').matches;
    layout();
    spEl.classList.toggle('single', single);
    show(spreadOfWord(ci));
    setCur(ci);
    var qp = (location.search.match(/page=(\d+)/) || [])[1];
    if (qp) {
      show(+qp);
      setCur(pages[spread * perUnit()][0] + 14);
    }
    document.addEventListener('click', function (e) {
      var a = e.target.closest('[data-act]');
      if (!a) {
        var pg = e.target.closest('.pg');
        if (
          pg &&
          !busy &&
          spEl.contains(pg) &&
          !window.getSelection().toString()
        ) {
          var rect = spEl.getBoundingClientRect();
          turn(
            e.clientX < rect.left + rect.width * (single ? 0.35 : 0.5) ? -1 : 1,
          );
        }
        return;
      }
      var k = a.dataset.act;
      if (k === 'next') turn(1, function () {});
      else if (k === 'prev') turn(-1, function () {});
      else if (k === 'play') play();
      else if (k === 'theme')
        theme(
          themes[
            (themes.indexOf(
              document.documentElement.getAttribute('data-theme'),
            ) +
              1) %
              3
          ],
        );
      else if (k === 'toc') {
        var t = $('[data-toc]');
        if (t) {
          var o = t.classList.toggle('open');
          a.setAttribute('aria-expanded', o);
        }
      } else if (k === 'faster') {
        rate = Math.max(70, rate - 30);
        info();
      } else if (k === 'slower') {
        rate = Math.min(600, rate + 30);
        info();
      } else if (k === 'collapse') {
        var c = a.closest('[data-collapsible]');
        c && c.classList.toggle('collapsed');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight') turn(1, function () {});
      else if (e.key === 'ArrowLeft') turn(-1, function () {});
      else if (e.key === ' ') {
        e.preventDefault();
        play();
      } else if (e.key === 't')
        document.querySelector('[data-act=theme]') &&
          document.querySelector('[data-act=theme]').click();
      else if (e.key === 'Escape') {
        var t = $('[data-toc].open');
        t && t.classList.remove('open');
      }
    });
    $$('[data-scrub]').forEach(function (s) {
      s.addEventListener('input', function () {
        play(false);
        var w = +s.value;
        show(spreadOfWord(w));
        setCur(w);
      });
    });
    matchMedia('(max-width: 760px)').addEventListener('change', relayout);
    if (new URLSearchParams(location.search).has('play')) play(true);
    window.__book = {
      turn: turn,
      play: play,
      setCur: setCur,
      state: function () {
        return {
          spread: spread,
          ci: ci,
          single: single,
          pages: pages.length,
          busy: busy,
        };
      },
    };
  }
  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
