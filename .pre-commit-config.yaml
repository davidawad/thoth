repos:
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (staged)
        entry: pnpm exec oxlint --deny-warnings
        language: system
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
      - id: typecheck
        name: tsc --noEmit
        entry: pnpm exec tsc --noEmit
        language: system
        types_or: [ts, tsx]
        # TS type-checking is whole-program, not per-file - pass no
        # filenames so tsc always checks the full project against its
        # own tsconfig.json rather than a subset that could hide errors.
        pass_filenames: false
      - id: prettier
        name: prettier (staged)
        entry: pnpm exec prettier --single-quote --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, scss, markdown]
        pass_filenames: true
      - id: commitlint
        name: commitlint (Conventional Commits)
        # `land` builds its candidate with a synthetic "chore: merge <branch> into
        # candidate (land)" commit inside a scratch worktree that has no
        # node_modules; commitlint's absence there was reported as a merge
        # conflict. Those commits are not authored history, so skip them.
        entry: sh -c 'case "$(head -n1 "$1")" in "chore: merge "*" into candidate (land)") exit 0;; esac; exec pnpm exec commitlint --edit "$1"' --
        language: system
        stages: [commit-msg]
        pass_filenames: true
